name: openai-knowledge-validate
on:
  push:
    paths:
      - 'packs/openai-knowledge/**'
      - '.github/workflows/openai-knowledge-validate.yml'
  pull_request:
    paths:
      - 'packs/openai-knowledge/**'
      - '.github/workflows/openai-knowledge-validate.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.12', '3.13']
    defaults:
      run:
        working-directory: packs/openai-knowledge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python scripts/validate.py
      - run: python -m unittest discover -s tests -v
      - run: python scripts/check_sources.py --no-network
      - name: Archive exactly the tested tracked pack
        if: matrix.python == '3.12'
        run: |
          git archive --format=zip --output="$RUNNER_TEMP/openai-knowledge.zip" HEAD:packs/openai-knowledge
          git rev-parse HEAD > "$RUNNER_TEMP/openai-knowledge-commit.txt"
          git rev-parse HEAD:packs/openai-knowledge > "$RUNNER_TEMP/openai-knowledge-tree.txt"
          cd "$RUNNER_TEMP"
          sha256sum openai-knowledge.zip > openai-knowledge.sha256
      - name: Keep reproducible review artifact
        if: matrix.python == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: openai-knowledge-tested
          path: |
            ${{ runner.temp }}/openai-knowledge.zip
            ${{ runner.temp }}/openai-knowledge-commit.txt
            ${{ runner.temp }}/openai-knowledge-tree.txt
            ${{ runner.temp }}/openai-knowledge.sha256
          retention-days: 14
          if-no-files-found: error
