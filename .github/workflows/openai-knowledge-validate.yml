name: openai-knowledge-validate
on:
  push:
    paths:
      - 'packs/openai-knowledge/**'
      - '.github/workflows/openai-knowledge-validate.yml'
  pull_request:
    paths:
      - 'packs/openai-knowledge/**'
      - '.github/workflows/openai-knowledge-validate.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.12', '3.13']
    defaults:
      run:
        working-directory: packs/openai-knowledge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python scripts/validate.py
      - run: python -m unittest discover -s tests -v
      - run: python scripts/check_sources.py --no-network
