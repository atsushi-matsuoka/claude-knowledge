name: openai-knowledge-source-watch
on:
  schedule:
    - cron: '19 22 * * 0' # Monday 07:19 JST; scheduling can be delayed.
  workflow_dispatch:
  push:
    paths:
      - 'packs/openai-knowledge/sources/manifest.json'
      - 'packs/openai-knowledge/scripts/check_sources.py'
      - '.github/workflows/openai-knowledge-source-watch.yml'
permissions:
  contents: read
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
    concurrency:
      group: openai-source-watch-${{ github.ref }}
      cancel-in-progress: false
    defaults:
      run:
        working-directory: packs/openai-knowledge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Observe official sources without rewriting knowledge
        id: scan
        continue-on-error: true
        run: python scripts/check_sources.py --update --report source-report.md
      - name: Keep observation artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openai-source-observation
          path: |
            packs/openai-knowledge/sources/source-status.json
            packs/openai-knowledge/source-report.md
          retention-days: 14
      - name: Persist observation only on main
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sources/source-status.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore(openai): record source observations, not semantic verification'
            git push
          fi
      - name: Open or update the review issue on main
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -s source-report.md
          if grep -q '^Review signals: 0$' source-report.md; then exit 0; fi
          title='[openai-knowledge] Source review'
          existing=$(gh issue list --state open --limit 100 --json number,title --jq '[.[] | select(.title == "[openai-knowledge] Source review")][0].number // empty')
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --body-file source-report.md
          else
            gh issue create --title "$title" --body-file source-report.md
          fi
      - name: Surface fetch failures
        if: steps.scan.outcome == 'failure'
        run: exit 1
