name: bootstrap-knowledge-pack

on:
  push:
    paths:
      - '.bootstrap/packpart-*'
      - '.github/workflows/bootstrap-pack.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bootstrap-knowledge-pack
  cancel-in-progress: true

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wait for complete pack
        id: ready
        shell: bash
        run: |
          count=$(find .bootstrap -maxdepth 1 -type f -name 'packpart-*' 2>/dev/null | wc -l)
          echo "count=$count" >> "$GITHUB_OUTPUT"
          if [ "$count" -ne 5 ]; then
            echo "Waiting for 5 chunks; currently have $count."
          fi
      - name: Reconstruct and unpack
        if: steps.ready.outputs.count == '5'
        run: |
          set -euo pipefail
          cat .bootstrap/packpart-* | base64 -d > /tmp/claude-knowledge-pack.zip
          rm -rf /tmp/claude-pack
          mkdir -p /tmp/claude-pack
          unzip -q /tmp/claude-knowledge-pack.zip -d /tmp/claude-pack
          test -d /tmp/claude-pack/claude-knowledge
          rsync -a --delete             --exclude '.git/'             --exclude '.bootstrap/'             --exclude '.github/workflows/'             /tmp/claude-pack/claude-knowledge/ ./
          rm -rf .bootstrap
          rm -f .chatgpt-write-test
      - name: Validate
        if: steps.ready.outputs.count == '5'
        run: |
          python scripts/validate_repository.py
          python scripts/check_sources.py --no-network
      - name: Commit initial pack
        if: steps.ready.outputs.count == '5'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Initialize Claude Knowledge Pack v0.1.0"
          git push
