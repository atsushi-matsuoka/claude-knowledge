name: bootstrap-knowledge-pack

on:
  push:
    paths:
      - '.bootstrap/claude-knowledge-pack.zip'
      - '.github/workflows/bootstrap-pack.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack knowledge pack
        run: |
          set -euo pipefail
          rm -rf /tmp/claude-pack
          mkdir -p /tmp/claude-pack
          unzip -q .bootstrap/claude-knowledge-pack.zip -d /tmp/claude-pack
          test -d /tmp/claude-pack/claude-knowledge
          rsync -a --delete             --exclude '.git/'             --exclude '.bootstrap/'             --exclude '.github/workflows/bootstrap-pack.yml'             /tmp/claude-pack/claude-knowledge/ ./
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-pack.yml
      - name: Validate
        run: |
          python scripts/validate_repository.py
          python scripts/check_sources.py --no-network
      - name: Commit initial pack
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Initialize Claude Knowledge Pack v0.1.0"
          git push
