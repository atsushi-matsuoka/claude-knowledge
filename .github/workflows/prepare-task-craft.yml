name: prepare-task-craft

on:
  push:
    branches: ['feat/task-craft-v0.3.0']
    paths:
      - '.bootstrap/**'
      - '.github/workflows/prepare-task-craft.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prepare-task-craft
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/feat/task-craft-v0.3.0'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare multi-skill integration
        run: python .bootstrap/prepare_task_craft.py
      - name: Generate canonical eval artifacts
        run: python scripts/build_evals.py
      - name: Validate repository
        run: python scripts/validate_repository.py
      - name: Run unit and local integration tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -v 2>&1 | tee /tmp/task-craft-tests.log
      - name: Validate source manifest
        run: python scripts/check_sources.py --no-network
      - name: Baseline newly added fetch sources
        run: python scripts/check_sources.py --update --report /tmp/task-craft-source-report.md
      - name: Confirm protected history and commit verified integration
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code 0ae4e1a0c16262af1317cc87f947876bce984e08 -- handoffs/
          python scripts/build_evals.py --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git reset -- .github/workflows
          git diff --cached --stat
          if ! git diff --cached --quiet; then
            git commit -m 'Integrate task-craft with multi-skill tooling and verified source baselines'
            git push origin HEAD:feat/task-craft-v0.3.0
          fi
          echo '## task-craft implementation checks' >> "$GITHUB_STEP_SUMMARY"
          echo 'Repository validator, unit/integration tests, generated-eval drift check and source-baseline fetch passed.' >> "$GITHUB_STEP_SUMMARY"
          grep '^Ran .* tests' /tmp/task-craft-tests.log >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/task-craft-source-report.md >> "$GITHUB_STEP_SUMMARY"
          echo 'No real-model effectiveness evaluation was executed.' >> "$GITHUB_STEP_SUMMARY"
